<title id="title">Synthetic training data: historical block-access comparison, 2010 and 2022</title>
<desc id="description">Computed from the invented PGMaps training project. Block A has a 1,264 m candidate through the shared bridge in 2010 and a 2,364 m candidate using the later bypass in 2022. Block B shares the bridge in 2010. The 2022 closure and conflicting load reports remain visible. These are geometric candidates, not proof of historical use.</desc>
