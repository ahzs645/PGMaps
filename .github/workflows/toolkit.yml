name: Verify geographic toolkit

# Only changes that can affect the package or its consumers. The PG Maps host
# tests in `toolkit:test` also run in checks.yml on every change.
on:
  pull_request:
    paths: &toolkit-paths
      - 'packages/geo-toolkit'
      - 'packages/geo-toolkit/**'
      - 'examples/toolkit-consumer/**'
      - 'scripts/toolkit/**'
      - 'src/lib/scoring/**'
      - 'src/lib/calculations/**'
      - 'src/lib/paletteScale*'
      - 'src/lib/color*'
      - 'src/lib/rasterClassGrid*'
      - 'src/lib/pngPixels*'
      - 'src/maps/scorebuilder/lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.github/workflows/toolkit.yml'
  push:
    branches: [main]
    paths: *toolkit-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # Toolkit verification initializes code dependencies without scraper data.
      - uses: actions/checkout@v4
      - name: Initialize toolkit and application npm dependencies
        run: git submodule update --init packages/geo-toolkit vendor/json-url
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run toolkit:check
      - run: npm run toolkit:lint
      - run: npm run toolkit:format:check
      - run: npm run toolkit:test
      - run: npm run toolkit:example:build
      - run: npm run toolkit:watch:check
      - run: npx playwright install --with-deps chromium
      - run: npm run toolkit:nested:test
      - run: npm run toolkit:example:test
      - run: npm run toolkit:pack:check -- --browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: toolkit-browser-reports
          path: |
            examples/toolkit-consumer/test-results
            examples/toolkit-consumer/playwright-report
