name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Read bcdatamapper source revision
        id: data-source
        run: echo "revision=$(git rev-parse HEAD:vendor/bcdatamapper)" >> "$GITHUB_OUTPUT"

      - name: Restore generated deployment data
        id: data-cache
        uses: actions/cache@v4
        with:
          path: public/data
          key: ${{ runner.os }}-pgmaps-data-v1-${{ steps.data-source.outputs.revision }}-${{ hashFiles('scripts/**', 'package.json', 'package-lock.json', 'public/data/projects/**', 'public/data/story-documents/**', 'public/data/smoke/**', 'public/data/walkability/heatmap/factor_masks.json') }}

      - name: Install data-generation dependencies
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: pip install -r vendor/bcdatamapper/datascrapers/bc/assessment/requirements.txt

      - name: Build national Census Subdivision overview
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run census:canada-csd-simplified -- --if-missing

      - name: Assemble bcdatamapper snapshots
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run data:sync-from-bcdatamapper:clean

      - name: Verify generated Census Subdivision deployment data
        run: test -s public/data/census/canada-csd-simplified.geojson

      - name: Build Census variable catalog
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run census:variables

      - name: Build BC Assessment dataset
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run bc-assessment:build

      - name: Copy Indigenous snapshot
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run indigenous:copy

      # Refresh MSP data in bcdatamapper and publish its snapshot separately.
      # Deployments must not depend on live ArcGIS/geocoder availability.
      - name: Verify committed MSP facilities snapshot
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const source = readFileSync('vendor/bcdatamapper/datascrapers/health/msp-facilities/output/msp-facilities.geojson', 'utf8')
          const deployed = readFileSync('public/data/health/msp-facilities.geojson', 'utf8')
          assert.equal(deployed, source, 'Deployed MSP data must match the committed scraper snapshot')
          const data = JSON.parse(deployed)
          assert.equal(data.type, 'FeatureCollection')
          assert.ok(Array.isArray(data.features) && data.features.length > 0, 'MSP snapshot must contain facilities')
          assert.equal(data.features.length, data.metadata.matchedFacilities)
          console.log(`Verified ${data.features.length} committed MSP facilities`)
          NODE

      - name: Verify transit coverage and routing
        run: |
          python3 vendor/bcdatamapper/datascrapers/transit/test-travel-time.py
          python3 vendor/bcdatamapper/datascrapers/transit/audit-travel-time.py --strict --report "$RUNNER_TEMP/transit-coverage-audit.json"
          npx vitest run src/pages/dev-transit/

      - run: npm run build
        env:
          PGMAPS_SKIP_VENDOR_DATA_SYNC: '1'
          VITE_BC_DB_CHUNK_BASE_URL: https://data.map.ahmad.sh/census/bc-db-chunks

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
