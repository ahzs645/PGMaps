name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run the full build and verification without deploying, so a
  # snapshot that no longer matches CI's products fails the PR, not main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Both scraper submodules feed public/data, so a pointer move in either
      # must miss the cache.
      - name: Read scraper submodule revisions
        id: data-source
        run: echo "revision=$(git rev-parse HEAD:vendor/bcdatamapper)-$(git rev-parse HEAD:vendor/canadadatamapper)" >> "$GITHUB_OUTPUT"

      # A hit is extracted over the checkout, so the key hashes every tracked
      # file under public/data (nothing else is there yet) or a stale cached
      # copy would replace it. The script folders it leaves out never write
      # public/data during a deploy; including them threw the cache away on
      # most pushes.
      - name: Restore generated deployment data
        id: data-cache
        uses: actions/cache@v4
        with:
          path: public/data
          key: ${{ runner.os }}-pgmaps-data-v2-${{ steps.data-source.outputs.revision }}-${{ hashFiles('scripts/**', '!scripts/lidar/**', '!scripts/nechako-server/**', '!scripts/nechako-worker/**', '!scripts/forestry/**', '!scripts/toolkit/**', '!scripts/prepare-lidar.py', '!scripts/lidar-environment.yml', 'package.json', 'package-lock.json', 'public/data/**') }}

      - name: Install data-generation dependencies
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: pip install -r vendor/bcdatamapper/datascrapers/bc/assessment/requirements.txt

      - name: Build national Census Subdivision overview
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run census:canada-csd-simplified -- --if-missing

      - name: Assemble bcdatamapper snapshots
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run data:sync-from-bcdatamapper:clean

      - name: Verify generated Census Subdivision deployment data
        run: test -s public/data/census/canada-csd-simplified.geojson

      - name: Build Census variable catalog
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run census:variables

      - name: Build BC Assessment dataset
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run bc-assessment:build

      - name: Copy Indigenous snapshot
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run indigenous:copy

      # Refresh MSP data in bcdatamapper and publish its snapshot separately.
      # Deployments must not depend on live ArcGIS/geocoder availability.
      - name: Verify committed MSP facilities snapshot
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const source = readFileSync('vendor/bcdatamapper/datascrapers/health/msp-facilities/output/msp-facilities.geojson', 'utf8')
          const deployed = readFileSync('public/data/health/msp-facilities.geojson', 'utf8')
          assert.equal(deployed, source, 'Deployed MSP data must match the committed scraper snapshot')
          const data = JSON.parse(deployed)
          assert.equal(data.type, 'FeatureCollection')
          assert.ok(Array.isArray(data.features) && data.features.length > 0, 'MSP snapshot must contain facilities')
          assert.equal(data.features.length, data.metadata.matchedFacilities)
          console.log(`Verified ${data.features.length} committed MSP facilities`)
          NODE

      - name: Verify transit coverage and routing
        run: |
          python3 vendor/bcdatamapper/datascrapers/transit/test-travel-time.py
          python3 vendor/bcdatamapper/datascrapers/transit/audit-travel-time.py --strict --report "$RUNNER_TEMP/transit-coverage-audit.json"
          npx vitest run src/pages/dev-transit/

      - run: npm run build
        env:
          PGMAPS_SKIP_VENDOR_DATA_SYNC: '1'
          VITE_BC_DB_CHUNK_BASE_URL: https://data.map.ahmad.sh/census/bc-db-chunks
          VITE_NECHAKO_GATEWAY_URL: https://pgmaps-nechako-portal.ahzs645.workers.dev/api/nechako-portal

      # EPT divides the 551 MB original into small browser-streamable tiles.
      # Keep generated binaries out of Git and restore them after the app build.
      # Restore and save are separate steps: products are saved as soon as they
      # are built, so a later verification failure no longer forces every run
      # to rebuild them (actions/cache only saves when the whole job succeeds).
      - name: Restore prepared LiDAR tiles
        id: lidar-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/data/lidar/bc-093g086
          key: pgmaps-lidar-ept-v1-${{ hashFiles('scripts/prepare-lidar.py', 'scripts/lidar-environment.yml') }}

      # Keyed on the scripts that produce the products only. Editing a test,
      # validator or browser check must not throw away a known-good build.
      - name: Restore processed forestry and building analysis
        id: lidar-analysis-cache
        uses: actions/cache/restore@v4
        with:
          # The intermediate grids stay outside dist (not deployed); snapshot
          # regeneration needs them alongside the products they came from.
          path: |
            dist/data/lidar-analysis/bc-093g086
            .lidar-work/analysis-grids.npz
          key: pgmaps-lidar-analysis-v2-${{ hashFiles('scripts/lidar/run.py', 'scripts/lidar/process.py', 'scripts/lidar/geolibre_tools.py', 'scripts/lidar/reference_tools.py', 'scripts/lidar/publish.py', 'scripts/lidar/requirements.txt', 'scripts/lidar-environment.yml') }}

      - name: Install LiDAR indexing tools
        id: lidar-env
        if: steps.lidar-cache.outputs.cache-hit != 'true' || steps.lidar-analysis-cache.outputs.cache-hit != 'true'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: scripts/lidar-environment.yml
          cache-environment: true

      - name: Prepare full LiDAR cloud for streaming
        if: steps.lidar-cache.outputs.cache-hit != 'true'
        run: micromamba run -n pgmaps-lidar python scripts/prepare-lidar.py --output dist/data/lidar/bc-093g086

      - name: Save prepared LiDAR tiles
        if: steps.lidar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/data/lidar/bc-093g086
          key: ${{ steps.lidar-cache.outputs.cache-primary-key }}

      - name: Install analysis dependencies
        if: steps.lidar-analysis-cache.outputs.cache-hit != 'true'
        run: micromamba run -n pgmaps-lidar python -m pip install -r scripts/lidar/requirements.txt

      - name: Process terrain, canopy, crown and roof candidates
        if: steps.lidar-analysis-cache.outputs.cache-hit != 'true'
        run: micromamba run -n pgmaps-lidar python scripts/lidar/run.py --output dist/data/lidar-analysis/bc-093g086 --work .lidar-work

      - name: Save processed analysis
        if: steps.lidar-analysis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist/data/lidar-analysis/bc-093g086
            .lidar-work/analysis-grids.npz
          key: ${{ steps.lidar-analysis-cache.outputs.cache-primary-key }}

      # The products CI built, for regenerating the committed snapshots from
      # exactly what gets deployed.
      - name: Keep the built analysis products
        if: steps.lidar-analysis-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lidar-analysis-bc-093g086
          path: dist/data/lidar-analysis/bc-093g086
          retention-days: 14

      - name: Verify analysis provenance and products
        run: python3 scripts/lidar/validate.py --analysis dist/data/lidar-analysis/bc-093g086 --roof-inspection src/pages/dev-lidar/roofInspection.generated.json

      # Each snapshot check reports even after an earlier one fails, so one run lists every stale snapshot.
      - name: Verify gap, plot, proximity and reconstruction snapshots
        if: ${{ !cancelled() }}
        run: python3 scripts/lidar/validate_workflows.py --analysis dist/data/lidar-analysis/bc-093g086

      - name: Verify forestry structure snapshots
        if: ${{ !cancelled() }}
        run: python3 scripts/lidar/validate_forestry.py --analysis dist/data/lidar-analysis/bc-093g086

      - name: Verify canopy heatmap previews
        if: ${{ !cancelled() }}
        run: python3 scripts/lidar/validate_heatmaps.py --analysis dist/data/lidar-analysis/bc-093g086

      - name: Verify species inventory and model snapshot
        if: ${{ !cancelled() }}
        run: python3 scripts/lidar/validate_species.py --analysis dist/data/lidar-analysis/bc-093g086

      - name: Verify species plot context
        if: ${{ !cancelled() }}
        run: python3 scripts/lidar/validate_species_context.py

      - name: Verify tree isolation and native-height detail
        if: ${{ !cancelled() }}
        run: python3 scripts/lidar/validate_tree_detail.py --analysis dist/data/lidar-analysis/bc-093g086

      - name: Verify tree segmentation benchmark provenance
        if: ${{ !cancelled() }}
        run: python3 scripts/lidar/validate_tree_benchmarks.py --analysis dist/data/lidar-analysis/bc-093g086

      - name: Test LiDAR inspection and workflow interfaces
        if: ${{ !cancelled() }}
        run: npx vitest run src/pages/dev-lidar

      # Snapshots must be computed from the exact products CI deploys (another
      # machine's build differs in its bytes), so when any check above fails,
      # regenerate them here from this run's products and upload the set to
      # commit. The tree benchmark needs R/PointTree and is not rerun; see
      # scripts/lidar/regenerate_snapshots.py --repin-benchmarks.
      - name: Install LiDAR tools for snapshot regeneration
        if: failure() && steps.lidar-env.outcome == 'skipped' && hashFiles('.lidar-work/analysis-grids.npz') != ''
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: scripts/lidar-environment.yml
          cache-environment: true

      - name: Regenerate stale LiDAR snapshots
        id: regenerate-snapshots
        if: failure() && hashFiles('.lidar-work/analysis-grids.npz') != ''
        run: |
          curl -sSL --retry 5 -o "$RUNNER_TEMP/source.laz" "https://drive.usercontent.google.com/download?id=12HM0-w7PNe_cC1t-ThLrFoBZngr4jgfI&export=download&confirm=t"
          echo "f5246f351e8d5923bf8a5dfddc0753032dbe8cb6e687ae58818cc701cb398ecf  $RUNNER_TEMP/source.laz" | sha256sum --check
          micromamba run -n pgmaps-lidar python -m pip install -r scripts/lidar/requirements-species.txt
          micromamba run -n pgmaps-lidar python scripts/lidar/regenerate_snapshots.py --analysis dist/data/lidar-analysis/bc-093g086 --grids .lidar-work/analysis-grids.npz --source "$RUNNER_TEMP/source.laz"
          git status --short src/pages/dev-lidar

      - name: Upload regenerated LiDAR snapshots
        if: failure() && steps.regenerate-snapshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lidar-snapshots-regenerated
          path: src/pages/dev-lidar/**/*.generated.json
          retention-days: 14

      - name: Verify complete LiDAR tiles
        run: python3 scripts/prepare-lidar.py --output dist/data/lidar/bc-093g086

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
