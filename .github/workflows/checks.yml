name: Checks

# The repository-wide type check, lint and unit suite. The other workflows
# only run the slice for their own area, so without this a broken test or a
# lint error anywhere else reaches main unnoticed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Five unit tests read synced scraper files (acknowledgement, indigenous, native-land and
      # boundaries under public/data), so the scraper data is copied first. It takes seconds. The
      # UI search files (`data:build-ui`) feed no test, so the checks skip them.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci:prepare
      - run: npm run help:check
      - run: node scripts/sync-bcdatamapper-data.mjs
      - run: npx tsc -b
      - run: npm run lint -- --max-warnings=0
      - run: npm run format:check
      - run: npx vitest run

  # The wasm only changes with these files, so cable-wasm runs when one of them does (or by hand).
  # A job skipped by `if:` reports Skipped, which counts as passing, so this stays safe if cable-wasm
  # is a required check.
  cable-changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cable: ${{ steps.filter.outputs.cable }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cable:
              - 'crates/cable-layout/**'
              - 'scripts/build-cable-wasm.mjs'
              - 'src/pages/dev-forestry-roads/cableLayout/cable_layout.wasm'
              - '.github/workflows/checks.yml'

  cable-wasm:
    needs: cable-changes
    if: github.event_name == 'workflow_dispatch' || needs.cable-changes.outputs.cable == 'true'
    # The cable-layout optimizer is Rust compiled to WebAssembly. The built file is committed beside
    # its loader so Vite, Vitest and the Pages build need no Rust; this job runs the crate's tests,
    # rebuilds it with the pinned toolchain and fails when the committed bytes differ. The rebuilt
    # file is uploaded as `cable-layout-wasm-rebuilt`: commit it as
    # src/pages/dev-forestry-roads/cableLayout/cable_layout.wasm.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        working-directory: crates/cable-layout
        run: rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
      - name: Crate tests
        working-directory: crates/cable-layout
        run: cargo test --release --locked
      - name: Rebuild cable_layout.wasm and compare
        run: npm run wasm:cable -- --check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cable-layout-wasm-rebuilt
          path: crates/cable-layout/target/wasm32-unknown-unknown/release/cable_layout.wasm
          if-no-files-found: ignore
