[package]
name = "cable-layout"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Multi-span skyline layout and intermediate-support optimizer for PGMaps' forestry road tool, compiled to WebAssembly."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false
